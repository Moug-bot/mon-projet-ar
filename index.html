<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Mon Expérience AR</title>
    <!-- Liens officiels et stables de production -->
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <!-- Correction du bug d'écran blanc sur mobile avec les paramètres de scène -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: color_and_matrix;">
      
      <!-- Déclencheur : Marqueur Hiro -->
      <a-marker preset="hiro">
        <!-- Un cube rouge virtuel -->
        <a-box position="0 0.5 0" material="color: red;" 
               animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
        </a-box>
      </a-marker>

      
    </a-scene>
  </body>
</html>
