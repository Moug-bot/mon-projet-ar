<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Expérience AR</title>
    <!-- Import du composant 3D de Google -->
    <script type="module" src="https://googleapis.com"></script>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f0f0; }
        model-viewer { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <!-- Remplacer "votre_modele" par les vrais noms de vos fichiers -->
    <model-viewer 
        src="pixellabs-treasure-chest-4062.glb" 
        ios-src="votre_modele.usdz"
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        shadow-intensity="1" 
        auto-rotate>
    </model-viewer>

</body>
</html>
